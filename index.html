<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 40px auto;
            max-width: 800px;
            padding: 0 20px;
            color: #333;
        }
        h1, h2 {
            color: #2c3e50;
        }
        section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }
        .nav-menu {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .nav-menu a {
            margin-right: 20px;
            text-decoration: none;
            font-weight: bold;
        }
        /* Custom link states styling */
        a:link {
            color: #3498db;
        }
        a:visited {
            color: #9b59b6;
        }
        a:hover {
            color: #2980b9;
            text-decoration: underline;
        }
        a:active {
            color: #e74c3c;
        }
        .image-link img {
            width: 150px;
            border: 2px solid #3498db;
            border-radius: 4px;
            transition: transform 0.2s;
        }
        .image-link img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <section id="links">
        <h2>Links</h2>
        <ul>
            <li><a href="https://pete-olson.com/portable-notes" target="_blank">Portable Notes</a></li>
            <li><a href="https://pete-olson.com/note-app" target="_blank">GiHub Notes Explorer</a></li>
            <li><a href="http://208.82.114.164/~peteolso/apps/notes/index.php" target="_blank">Hobo Notes</a></li>
            <li><a href="https://shadow.hobohost.com:2083" target="_blank">HoboHost Cpanel</a><</li>
		</ul>
    </section>
</body>
</html>
